events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Rate limiting zone for Registry CLI endpoints
    limit_req_zone $binary_remote_addr zone=cli_limit:10m rate=30r/s;

    upstream second_brain_upstream {
        server second-brain-hub:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 50M;

        # Gzip Compression
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

        # Static assets caching
        location /assets/ {
            proxy_pass http://second_brain_upstream;
            proxy_cache_valid 200 1d;
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
        }

        # CLI Manifest Endpoint with Rate Limiting
        location /api/registry/ {
            limit_req zone=cli_limit burst=20 nodelay;
            proxy_pass http://second_brain_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket Upgrade for Live Sandbox & Second Brain Telemetry
        location /ws/ {
            proxy_pass http://second_brain_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        # Fallback to SPA
        location / {
            proxy_pass http://second_brain_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
